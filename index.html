<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO - Final Optional</title>
<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=0qgQ2aN09QT_aa62vykfJbEklSyIn13q8IVndFQbRo9FQoCOl-yTc0j7GQsL0-t8YOm0yXfflD2epKhdpNv9Ck6bRzPMVUrYna512VvGTGQkVvjxhlg9-mqqsEctUtpR7K9XU3FdyVvuGSnzmb7LRjRrpz991C4f2OfI0TaURgZavl7nfm6WC40Tnj5hfh-KkDwZfISyt4FmsArDJ7jQHVqmLTMeY494tY2hUj5Psw8AkixOrdEzzqK9nrD8x3l70Ojb7nopwGHkSNdzAXu-xI5_3kG3sh9XddxdluXdVMA" charset="UTF-8"></script><style>body{font-family:Inter,sans-serif;background:#f5f5f0;margin:0;padding:12px}.card{background:#fff;border-radius:16px;padding:16px;margin:0 auto;max-width:650px}.btn{background:#000;color:#fff;border:none;padding:14px;border-radius:10px;font-weight:900;width:100%;font-size:16px;margin:6px 0}.btn2{background:#fff;color:#000;border:2px solid #000;padding:12px;border-radius:10px;font-weight:700;width:100%}input,select,textarea{width:100%;padding:12px;border:2px solid #000;border-radius:10px;margin:6px 0;font-size:15px;box-sizing:border-box}.editable{background:#fffde7!important;border:2px solid #f59e0b!important}.locked{background:#f5f5f5!important}.count{display:flex;gap:8px;margin:12px 0}.count div{flex:1;border:2px solid #000;border-radius:12px;padding:10px;text-align:center}</style>
</head><body>
<div class="card">
<h2>Form SO - Final Optional</h2>
<div style="font-size:10px;background:#dcfce7;padding:8px;border-radius:8px;word-break:break-all">PUB: https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-ZXhjDIk9o7N1I7CZzfenz3PXmn8hIg6q2psASOCO_bfjS0ZkzPj_yO-9p4pu6Tr8YLn725QtWjky/pub?gid=0&single=true&output=csv</div>
<div class="count"><div><b id="total">0</b><br><small>TOTAL</small></div><div style="background:#000;color:#fff"><b id="sudah">0</b><br><small>TERISI</small></div><div><b id="belum">0</b><br><small>BELUM</small></div></div>
<button class="btn" onclick="cekUpdate()">🔄 CEK UPDATE</button>
<button class="btn2" onclick="generateWA()">📱 GENERATE WA - Semua Optional</button>
<div id="status" style="margin:10px 0;padding:10px;border-radius:10px;display:none"></div>
<div style="margin:12px 0"><label>Pilih OJ:</label><select id="ojSelect" onchange="loadOJ()"><option>-- CEK UPDATE --</option></select></div>
<div id="formArea" style="display:none">
<b id="f_oj"></b> - <span id="f_pelanggan"></span><br><small>Tgl Input: <b id="f_tgl"></b></small>
<label>TGL INPUT (dari Sheet) 🔒:</label><input id="f_tgl_input" class="locked" readonly style="background:#f5f5f5">
<label>ALASAN (optional) ✏️:</label><textarea id="f_alasan" class="editable" placeholder="Boleh kosong"></textarea>
<label>ACTION (optional) ✏️:</label><textarea id="f_action" class="editable" placeholder="Boleh kosong"></textarea>
<label>TINDAK LANJUT (optional) ✏️:</label><textarea id="f_tindak" class="editable" placeholder="Boleh kosong"></textarea>
<label>TGL RENCANA TARIK (optional) ✏️ - di akhir WA:</label><input id="f_rencana" class="editable" type="date">
<button class="btn" onclick="simpan()">💾 SIMPAN - Boleh Kosong</button>
</div>
<h3>Data:</h3><div id="list" style="max-height:250px;overflow:auto;border:2px solid #000;border-radius:10px"></div>
<h3>WA (Rencana di akhir, hanya kalau diisi):</h3><textarea id="waReport" style="height:350px"></textarea>
<button class="btn2" onclick="copyWA()">📋 COPY WA</button>
<button class="btn" onclick="shareWA()">📤 SHARE WA</button>
</div>
<script>
const PUB_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-ZXhjDIk9o7N1I7CZzfenz3PXmn8hIg6q2psASOCO_bfjS0ZkzPj_yO-9p4pu6Tr8YLn725QtWjky/pub?gid=0&single=true&output=csv";
let allData=[]; let key='so_belum_tarik_final_pub';
function parseCSV(t){const l=t.trim().split('\n');const r=[];for(let line of l){let res=[];let cur='';let inQ=false;for(let i=0;i<line.length;i++){let c=line[i];if(c=='"')inQ=!inQ;else if(c==','&&!inQ){res.push(cur.trim());cur='';}else cur+=c;}res.push(cur.trim());r.push(res);}return r;}
async function cekUpdate(){let s=document.getElementById('status');s.style.display='block';s.style.background='#fef3c7';s.innerHTML='⏳ CEK UPDATE...';try{let r=await fetch(PUB_URL);if(!r.ok)throw new Error('HTTP '+r.status);let t=await r.text();let rows=parseCSV(t);allData=[];for(let i=1;i<rows.length;i++){let rr=rows[i];if(!rr[0]&&!rr[1])continue;allData.push({tgl:rr[0]||'',oj:rr[1]||'',pelanggan:rr[2]||'',sales:rr[3]||'',alasan:rr[4]||'',action:rr[5]||'',tindak:rr[6]||'',rencana:rr[7]||'',status:rr[8]||''});}localStorage.setItem(key,JSON.stringify(allData));render();s.innerHTML='✅ Berhasil '+allData.length+' SO';s.style.background='#dcfce7';}catch(e){s.innerHTML='❌ '+e.message;let saved=localStorage.getItem(key);if(saved){allData=JSON.parse(saved);render();}}}
function render(){document.getElementById('total').innerText=allData.length;document.getElementById('sudah').innerText=allData.filter(d=>d.alasan||d.action||d.tindak||d.rencana).length;document.getElementById('belum').innerText=allData.length-allData.filter(d=>d.alasan||d.action||d.tindak||d.rencana).length;let sel=document.getElementById('ojSelect');sel.innerHTML='<option value="">-- Pilih OJ --</option>';allData.forEach((d,i)=>{let o=document.createElement('option');o.value=i;o.text=d.oj+' - '+d.pelanggan+' '+(d.rencana?'📅 '+d.rencana:'');sel.appendChild(o);});let list=document.getElementById('list');list.innerHTML='';allData.forEach(d=>{let div=document.createElement('div');div.style.padding='8px';div.style.borderBottom='1px solid #ddd';div.innerHTML='<b>'+d.oj+'</b> - '+d.pelanggan+'<br>Tgl Input: '+d.tgl+(d.rencana?'<br>📅 Rencana: <b>'+d.rencana+'</b>':'');list.appendChild(div);});}
function loadOJ(){let idx=document.getElementById('ojSelect').value;if(idx===''){document.getElementById('formArea').style.display='none';return;}let d=allData[idx];document.getElementById('f_oj').innerText=d.oj;document.getElementById('f_pelanggan').innerText=d.pelanggan;document.getElementById('f_tgl').innerText=d.tgl;document.getElementById('f_tgl_input').value=d.tgl;document.getElementById('f_alasan').value=d.alasan;document.getElementById('f_action').value=d.action;document.getElementById('f_tindak').value=d.tindak;document.getElementById('f_rencana').value=d.rencana;document.getElementById('formArea').style.display='block';document.getElementById('formArea').dataset.idx=idx;}
function simpan(){
  let idx=document.getElementById('formArea').dataset.idx;
  let d=allData[idx];
  d.alasan=document.getElementById('f_alasan').value;
  d.action=document.getElementById('f_action').value;
  d.tindak=document.getElementById('f_tindak').value;
  d.rencana=document.getElementById('f_rencana').value;
  localStorage.setItem(key,JSON.stringify(allData));
  alert('✅ Disimpan '+d.oj+' (boleh kosong, optional)');
  render();
}
function generateWA(){
  let tgl=new Date().toLocaleDateString('id-ID');
  if(allData.length===0){alert('CEK UPDATE dulu');return;}
  let txt='*LAPORAN SO BELUM TARIK '+tgl+'*\n';
  txt+='Total: '+allData.length+' SO\n';
  txt+='--------------------------------\n\n';
  allData.forEach((d,i)=>{
    // Hanya tampilkan yang ada isi minimal 1 keterangan
    if(!d.alasan && !d.action && !d.tindak && !d.rencana) return;
    txt+=(i+1)+'. *'+d.oj+' - '+d.pelanggan+'*\n';
    txt+='   Tgl Input: '+d.tgl+'\n';
    if(d.alasan) txt+='   Alasan: '+d.alasan+'\n';
    if(d.action) txt+='   Action: '+d.action+'\n';
    if(d.tindak) txt+='   Tindak Lanjut: '+d.tindak+'\n';
    // Rencana di akhir, hanya kalau diisi
    if(d.rencana) txt+='   📅 Rencana Tarik: '+d.rencana+'\n';
    txt+='\n';
  });
  if(txt.trim().endsWith('--------------------------------')){
    txt+='Belum ada keterangan yang diisi.\n';
  }
  document.getElementById('waReport').value=txt;
}
function copyWA(){let ta=document.getElementById('waReport');ta.select();document.execCommand('copy');alert('Tercopy!');}
function shareWA(){let txt=document.getElementById('waReport').value;if(!txt){alert('Generate dulu');return;}window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}
(function(){let saved=localStorage.getItem(key);if(saved){allData=JSON.parse(saved);render();}})();
</script>
</body></html>
